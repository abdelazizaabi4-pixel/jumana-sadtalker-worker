name: Build and Push Jumana SadTalker Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image V18.7
        run: |
          docker build -t abdelazizaabi/jumana-sadtalker-worker:v18-7 ./runpod_serverless_worker

      - name: Push Docker image V18.7
        run: |
          docker push abdelazizaabi/jumana-sadtalker-worker:v18-7
